name: Source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: "python -B tools/check_public_source.py"
      - run: "python -B -c \"import hashlib,json,pathlib; r=pathlib.Path('.'); m=json.loads((r/'SOURCE-MANIFEST.json').read_bytes()); bad=[n for n,h in m['files'].items() if hashlib.sha256((r/n).read_bytes()).hexdigest()!=h]; assert not bad,bad\""
