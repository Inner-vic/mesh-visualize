<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mesh 十图视觉复核</title><style>
*{box-sizing:border-box}body{font:16px/1.6 system-ui,sans-serif;color:#192a3e;background:#f0f4f7;margin:0}main{max-width:1100px;margin:auto;padding:26px}header,article{background:white;border:1px solid #d4dfe8;border-radius:12px;padding:24px;margin:16px 0}h1{font-size:28px}h2{font-size:20px}.muted{color:#526579}label{display:block;margin-top:14px}input[type=text],textarea,select{width:100%;font:inherit;padding:9px;border:1px solid #acbdcc;border-radius:5px}textarea{min-height:72px}img{display:block;image-rendering:pixelated;width:100%;background:#101820;border-radius:4px}.diff{width:50%}.tag{background:#e3edf7;padding:4px 10px;border-radius:4px}button{background:#1e5791;color:white;border:0;padding:10px 18px;border-radius:6px;font:inherit;cursor:pointer;margin:5px 8px 5px 0}.bar{position:sticky;bottom:0;background:#fff;padding:12px;border-top:1px solid #cbd5e1}p{overflow-wrap:anywhere}.error{color:#a11}small{color:#526579}details{margin:12px 0}code{word-break:break-all}@media(max-width:600px){main{padding:12px}header,article{padding:14px}.diff{width:100%}}
</style><main><header><h1>2.5D Mesh · 十图视觉复核</h1><p id="status" class="tag"></p><p id="identity"></p><p>默认五视图包含 GT、Prediction、Camera、LiDAR、Gaussian；scene 模式另含实车照片投影。先看实际场景，再对照分类与几何缺陷。旧版俯视网格是辅助诊断；标注 DEMO 的页面使用模拟数据。</p><details><summary>辅助 BEV 图例与评价边界（主场景卡图例在卡内）</summary><p id="legend"></p><p>0.1m BEV 诊断；本工具不计算正式 pillar M1 或真实高度 M2。图像已生成仍需实际复核。填写姓名和勾选记录表示复核者确认，程序不能证明是否认真读图。</p></details><label>复核者姓名<input id="reviewer" type="text"></label><label>整组总结<textarea id="summary"></textarea></label><small>可保存浏览器草稿；正式交付需要导出 JSON 后执行 finalize。草稿只存在当前浏览器，不会上传。</small></header><div id="cards"></div><div class="bar"><span id="progress"></span><button id="save">保存草稿</button><button id="export">导出逐图分析 JSON</button><p id="message" class="error"></p></div></main>
<script id="payload" type="application/json">__PAYLOAD__</script><script>
'use strict';
const data=JSON.parse(document.getElementById('payload').textContent),m=data.manifest,r=data.review;
const $=id=>document.getElementById(id), fields=[['classification','分类：正确、混淆和漏检'],['boundary','边界：错位、膨胀、侵蚀或粘连'],['shape','形状：完整、断裂或消失'],['matching','匹配：对应区域、支持量和限制']];
const key='mesh-review-'+r.run_manifest_sha256;
let draft;try{draft=JSON.parse(localStorage.getItem(key)||'null')}catch{}
if(draft&&draft.run_manifest_sha256===r.run_manifest_sha256&&!data.result)Object.assign(r,draft);
$('status').textContent=(m.demo?'模拟 DEMO · ':'')+(data.result?'评价材料完整 · M3 '+data.result.m3_verdict:'等待实际逐图复核');
$('identity').textContent='协议：'+m.protocol_id+' ｜任务：'+(m.identity.task_uid||'未绑定');
$('reviewer').value=r.reviewer;$('summary').value=r.summary;
const palette=[[1,'沥青','#7f7f7f'],[2,'水泥','#c8c8c8'],[4,'砖石路','#a07846'],[16,'减速带','#ff0000'],[17,'井盖','#0080ff'],[23,'桥梁接缝','#ffa500'],[24,'可移动障碍物','#00c800'],[25,'不可移动障碍物','#8000c8']];
for(const [id,name,color] of palette){const s=document.createElement('span');s.style.marginRight='18px';const c=document.createElement('span');c.textContent='■ ';c.style.color=color;s.append(c,document.createTextNode(id+' '+name));$('legend').append(s)}
for(const row of r.rows){const card=document.createElement('article'),title=document.createElement('h2');title.textContent='样本 '+row.index+' · frame '+row.frame_index;card.append(title);const scene=document.createElement('p');scene.className='muted';scene.textContent=row.scene_name;card.append(scene);if(row.scene_card){const primary=document.createElement('img');primary.src=row.scene_card.path;primary.alt=m.primary_view==='viewer'?'GT、Prediction、Camera、LiDAR、Gaussian五视图':'实车照片、GT/PRED三维点与投影场景卡';card.append(primary)}const aux=document.createElement('details');if(row.scene_card){const summary=document.createElement('summary');summary.textContent='展开辅助俯视网格与差异图';aux.append(summary);card.append(aux)}for(const type of ['comparison','diff']){const caption=document.createElement('p');caption.textContent=type==='comparison'?'左 GT ／右 PRED':'差异图';const im=document.createElement('img');im.src=row.images[type].path;im.alt='样本 '+row.index+' '+type;if(type==='diff')im.className='diff';(row.scene_card?aux:card).append(caption,im)}for(const [name,label] of fields){const l=document.createElement('label');l.textContent=label;const input=document.createElement('textarea');input.id=name+'-'+row.index;input.value=row[name];input.disabled=!!data.result;l.append(input);card.append(l)}const l=document.createElement('label');l.textContent='样本结论';const select=document.createElement('select');select.id='verdict-'+row.index;for(const [v,text] of [['','请选择'],['pass','通过'],['fail','失败'],['inconclusive','证据不足']]){const o=document.createElement('option');o.value=v;o.textContent=text;select.append(o)}select.value=row.verdict;select.disabled=!!data.result;l.append(select);card.append(l);const ack=document.createElement('label'),check=document.createElement('input');check.type='checkbox';check.id='inspected-'+row.index;check.checked=row.inspected;check.disabled=!!data.result;ack.append(check,document.createTextNode(row.scene_card?' 我已实际检查此样本主图的各个视图':' 我已实际检查此样本的对照图与差异图'));card.append(ack);$('cards').append(card)}
function collect(){r.reviewer=$('reviewer').value.trim();r.summary=$('summary').value.trim();r.reviewer_type='human';for(const row of r.rows){for(const [name] of fields)row[name]=$(name+'-'+row.index).value.trim();row.verdict=$('verdict-'+row.index).value;row.inspected=$('inspected-'+row.index).checked}const verdicts=r.rows.map(x=>x.verdict);r.overall_verdict=verdicts.includes('fail')?'fail':(verdicts.includes('inconclusive')?'inconclusive':'pass');return r}
function progress(){const n=r.rows.filter(x=>$('inspected-'+x.index).checked).length;$('progress').textContent='已确认 '+n+' / 10'}document.addEventListener('change',progress);progress();
$('save').onclick=()=>{try{localStorage.setItem(key,JSON.stringify(collect()));$('message').textContent='草稿已保存到当前浏览器。'}catch(e){$('message').textContent='当前浏览器不能保存草稿，请导出 JSON。'}};
$('export').onclick=()=>{collect();if(!r.reviewer||!r.summary||r.rows.some(row=>!row.inspected||!row.verdict||fields.some(([name])=>!row[name]))){$('message').textContent='请填写复核者、总结和全部十行判断，并逐张确认实际看图。';return}r.completed_at=new Date().toISOString();const blob=new Blob([JSON.stringify(r,null,2)+'\n'],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='visual-review.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);$('message').textContent='已导出。请将 JSON 交给 finalize 绑定到本轮产物。'};
if(data.result){$('save').disabled=true;$('export').disabled=true;$('reviewer').disabled=true;$('summary').disabled=true}
</script></html>
